<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rick and Morty</title>
    <link rel="icon" type="image/svg+xml" href="images/Madriaga_logo.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Open+Sans:wght@300;400;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body style="background-color: #015D53;">
    <div class="container-fluid" id="Home">
        <div class="row">
            <div class="col-12">
                <div class="navbar shadow-lg fixed-top" style="background-color: black">
                    <div class="container-fluid">
                        <a class="navbar-brand" href="#"><img src="images/Rick_and_Morty_Logo.png"
                                alt="Rick and Morty Logo" style="width: 200px; height: 50px" /></a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                            data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar"
                            aria-label="Toggle navigation" style="background-color: #6ECB5A;">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="offcanvas offcanvas-end bg-dark text-white" tabindex="-1" id="offcanvasNavbar"
                            aria-labelledby="offcanvasNavbarLabel">
                            <div class="offcanvas-header">
                                <h5 class="offcanvas-title" id="offcanvasNavbarLabel" style="font-weight: bold;">
                                    The Rick and Morty Gallery </h5>
                                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                                    aria-label="Close"></button>
                            </div>
                            <div class="offcanvas-body">
                                <div class="navbar-nav text-center flex-grow-1 pe-3">
                                    <h1 class="text-secondary" style="text-shadow: none;">Search by name</h1>
                                    <hr class="text-secondary" />
                                    <form class="d-flex mb-3" role="search" id="searchForm">
                                        <input id="searchInput" text="text"
                                            class="form-control me-2 bg-dark text-white border-success" type="search"
                                            placeholder="Search by name..." aria-label="Search by name">
                                        <button class="btn btn-success" type="submit">GO</button>
                                    </form>
                                    <div class="d-flex flex-column gap-2">
                                        <a class="btn btn-outline-success" href="#characterList">Browse Characters</a>
                                        <a class="btn btn-outline-light"
                                            href="https://rickandmortyapi.com/documentation" target="_blank">API
                                            Docs</a>
                                        <button class="btn btn-outline-info" type="button" data-bs-toggle="modal"
                                            data-bs-target="#characterModal" onclick="openRandomModal()">Random
                                            Character</button>
                                    </div>
                                    <div class="mt-4">
                                        <span class="text-secondary text-uppercase small">Quick Filters</span>
                                        <div class="row justify-content-center align-items-center">
                                            <div class="col-12">
                                                <span class="badge bg-success" onclick="setStatusFilter('alive')"
                                                    style="cursor: pointer;">Alive</span>
                                                <span class="badge bg-danger" onclick="setStatusFilter('dead')"
                                                    style="cursor: pointer;">Dead</span>
                                                <span class="badge bg-secondary" onclick="setStatusFilter('unknown')"
                                                    style="cursor: pointer;">Unknown</span>
                                                <span class="badge bg-warning text-dark"
                                                    onclick="setSpeciesFilter('Human')"
                                                    style="cursor: pointer;">Human/Humanoid</span>
                                                <span class="badge bg-primary" onclick="setSpeciesFilter('Alien')"
                                                    style="cursor: pointer;">Alien</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid" style="background-color: #028476;">
        <div class="row align-items-center">
            <div class="col-12 justify-content-center text-center mt-5 pt-5">
                <img class="img-fluid rounded-4" src="images/Rick_and_Morty_banner.webp" alt="banner"
                    style="width: 75%" />
            </div>
        </div>
        <div class="row p-3">
            <div class="col-12 col-md-8 text-start">
                <h1><strong>Explore all the Characters in the Rick and Morty Universe</strong></h1>
            </div>
            <div class="col-6 col-md-2">
                <select id="statusFilter" class="form-select"
                    style="border-color: rgb(33, 100, 33); color: #6ECB5A; background-color: #030303">
                    <option value="">All Status</option>
                    <option value="alive">Alive</option>
                    <option value="dead">Dead</option>
                    <option value="unknown">Unknown</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <select id="speciesFilter" class="form-select"
                    style="border-color: rgb(33, 100, 33); color: #6ECB5A; background-color: #030303">
                    <option value="">All Species</option>
                    <option value="Human">Human/Humanoid</option>
                    <option value="Alien">Alien</option>
                </select>
            </div>
        </div>
    </div>

    <div class="container-fluid">

        <div class="row align-items-center justify-content-center" id="characterList"></div>

        <div class="modal fade" id="characterModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content bg-dark text-white">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalName"></h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body text-center">
                        <img id="modalImage" class="img-fluid rounded mb-3" />
                        <p id="modalDetails"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-6 jus">
                <nav aria-label="Page navigation example">
                    <ul class="pagination">
                        <li class="page-item">
                            <a class="page-link" aria-label="Previous" onclick="prevPage()"
                                style="color: #6ECB5A; background-color: #030303">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item">
                            <a class="page-link" aria-label="Next" onclick="nextPage()"
                                style="color: #6ECB5A; background-color: #030303">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            <div class="col-6 text-end" style="font-weight: bold; color: #030303;">
                <div id="pageText">Page 1</div>
            </div>
        </div>
    </div>

    <div class="container-fluid text-light" id="footer" style="background-color: #000000;">
        <div class="row py-3 px-3 align-items-center justify-content-center">
            <div class="col-12 text-center">
                <h1 class="mb-1 fs-6">© 2025 EduCode. All rights reserved.</h1>
                <img src="images/Madriaga_logo.svg" alt="myLogo" style="height: 100px; width: 100px;" />
                <a class="btn btn-outline-light btn-sm me-1" href="https://educode597.github.io/"><i
                        class="bi bi-github"></i></a>
                <a class="btn btn-outline-light btn-sm" href="https://www.facebook.com/johneduard.madriaga.7"><i
                        class="bi bi-facebook"></i></a>
                <a class="btn btn-outline-light btn-sm" href="https://www.instagram.com/duard.gg/"><i
                        class="bi bi-instagram"></i></a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="script.js"></script>
</body>

</html>
